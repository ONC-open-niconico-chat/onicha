# Dependabot：依存ライブラリの脆弱性/更新を自動でPR化する。
# ・version updates（最新化PR）はこのファイルで設定。
# ・Dependabot alerts / security updates は GitHub の
#   Settings → Code security（Dependabot alerts / Dependabot security updates）でONにすること。
#   （このファイルだけでは有効化されない）
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # マイナー/パッチはまとめて1PRにして通知ノイズを減らす
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # 開発ツール/フレームワークのメジャー自動更新は避ける（手動で慎重に上げる）。
      # ※ いずれも minor/patch とセキュリティ修正は引き続きPRされる。
      # Next は独自仕様のため major は手動対応。
      - dependency-name: "next"
        update-types:
          - "version-update:semver-major"
      # TypeScript major はツールチェーン互換(Next/typescript-eslint等)が揃ってから手動で。
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # ESLint major は eslint-config-next の対応確認後に手動で。
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
      # @types/node は実行環境(Vercel)の Node メジャーに合わせて手動で上げる。
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
